<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — eSync</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dash-body">

<div class="background">
    <div class="blob one"></div>
    <div class="blob two"></div>
</div>

<div class="dash-shell">
    <aside class="dash-sidebar" id="dashSidebar">
        <a href="index.html" class="brand">
            <img src="eSynxd.logo.png" class="brand-mark" alt="" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
            <span class="brand-mark-fallback" style="display:none;">eS</span>
            <span class="brand-name">eSync</span>
        </a>

        <nav class="dash-nav">
            <button class="dash-nav-item active" data-tab="home"><i class="fa-solid fa-house"></i> Home</button>
            <button class="dash-nav-item" data-tab="calendar"><i class="fa-solid fa-calendar-days"></i> Calendar</button>
            <button class="dash-nav-item" data-tab="timetable"><i class="fa-solid fa-clock"></i> Timetable</button>
            <button class="dash-nav-item" data-tab="homework"><i class="fa-solid fa-book"></i> Homework</button>
            <button class="dash-nav-item" data-tab="messages"><i class="fa-solid fa-envelope"></i> Messages</button>
            <button class="dash-nav-item" data-tab="badge"><i class="fa-solid fa-bus"></i> Bus badge</button>
            <button class="dash-nav-item" data-tab="profile"><i class="fa-solid fa-user"></i> Profile</button>
        </nav>

        <div class="dash-sidebar-foot">
            <div class="user-chip" id="sidebarUserChip">
                <span id="sidebarAvatarSlot"><span class="avatar">?</span></span>
                <span id="sidebarName">Loading…</span>
            </div>
            <button class="btn btn-ghost btn-block" id="logoutBtn">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> Log out
            </button>
        </div>
    </aside>

    <button class="dash-menu-toggle" id="dashMenuToggle" aria-label="Toggle menu">
        <i class="fa-solid fa-bars"></i>
    </button>

    <main class="dash-main">
        <header class="dash-header">
            <h1 id="dashTitle">Home</h1>
            <span class="role-pill" id="rolePill">—</span>
        </header>

        <!-- HOME -->
        <section class="tab-panel active" id="panel-home">
            <div class="home-grid">
                <div class="home-card">
                    <h3><i class="fa-solid fa-calendar-check"></i> Today</h3>
                    <div id="homeToday"></div>
                </div>
                <div class="home-card">
                    <h3><i class="fa-solid fa-book-open"></i> Your homework</h3>
                    <div id="homeHomework"></div>
                </div>
                <div class="home-card">
                    <h3><i class="fa-solid fa-bell"></i> Announcements</h3>
                    <div id="homeAnnouncements"></div>
                </div>
                <div class="home-card" data-role="teacher">
                    <h3><i class="fa-solid fa-users-class"></i> Your class</h3>
                    <div id="homeClass"></div>
                </div>
            </div>
        </section>

        <!-- CALENDAR (Excursions/Events) -->
        <section class="tab-panel" id="panel-calendar">
            <div class="calendar-toolbar">
                <button class="btn btn-primary" id="calAddBtn" data-role="teacher">
                    <i class="fa-solid fa-plus"></i> Add excursion
                </button>
            </div>
            <div id="excursionsList" class="excursions-list"></div>
        </section>

        <!-- TIMETABLE -->
        <section class="tab-panel" id="panel-timetable">
            <div class="timetable-toolbar">
                <button class="btn btn-primary" id="ttEditBtn" data-role="teacher">
                    <i class="fa-solid fa-edit"></i> Edit timetable
                </button>
            </div>
            <div class="timetable-grid" id="timetableGrid"></div>
        </section>

        <!-- HOMEWORK -->
        <section class="tab-panel" id="panel-homework">
            <div class="homework-toolbar">
                <button class="btn btn-primary" id="hwNewBtn" data-role="teacher">
                    <i class="fa-solid fa-plus"></i> Assign homework
                </button>
            </div>
            <div id="homeworkList" class="homework-list"></div>
        </section>

        <!-- MESSAGES -->
        <section class="tab-panel" id="panel-messages">
            <div class="messages-shell">
                <div class="messages-list-col">
                    <button class="btn btn-primary btn-block" id="newMessageBtn" data-role="teacher">
                        <i class="fa-solid fa-pen"></i> Send message
                    </button>
                    <div id="messagesList" class="messages-list"></div>
                </div>
                <div class="messages-thread-col" id="messagesThread">
                    <p class="muted-note">Select a message to read it.</p>
                </div>
            </div>
        </section>

        <!-- BUS BADGE -->
        <section class="tab-panel" id="panel-badge">
            <div id="badgeContent"></div>
        </section>

        <!-- PROFILE -->
        <section class="tab-panel" id="panel-profile">
            <div class="panel-card profile-card">
                <h3><i class="fa-solid fa-id-badge"></i> Your profile</h3>
                <div class="avatar-preview-row">
                    <span id="avatarPreview"></span>
                    <div class="field" style="flex:1;margin-bottom:0;">
                        <label for="profPicture">Profile picture URL</label>
                        <div class="input-wrap"><i class="fa-solid fa-image"></i><input id="profPicture" type="text" placeholder="https://…"></div>
                    </div>
                </div>
                <div class="field" id="profNameField">
                    <label for="profName">Display name</label>
                    <div class="input-wrap"><i class="fa-solid fa-signature"></i><input id="profName" type="text"></div>
                </div>
                <div class="profile-readonly" id="profileReadonly"></div>
                <div class="form-msg success" id="profMsg"><i class="fa-solid fa-circle-check"></i><span id="profMsgText"></span></div>
                <button class="btn btn-primary" id="profSaveBtn"><i class="fa-solid fa-floppy-disk"></i> Save changes</button>
            </div>
        </section>
    </main>
</div>

<!-- MODALS -->
<div class="modal-overlay" id="excursionModal">
    <div class="modal-panel">
        <div class="modal-head">
            <h3>Add excursion</h3>
            <button class="modal-close" id="excursionModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="excursionModalBody"></div>
    </div>
</div>

<div class="modal-overlay" id="timetableModal">
    <div class="modal-panel">
        <div class="modal-head">
            <h3>Edit period</h3>
            <button class="modal-close" id="timetableModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="timetableModalBody"></div>
    </div>
</div>

<div class="modal-overlay" id="homeworkModal">
    <div class="modal-panel">
        <div class="modal-head">
            <h3>Assign homework</h3>
            <button class="modal-close" id="homeworkModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="homeworkModalBody"></div>
    </div>
</div>

<div class="modal-overlay" id="messageModal">
    <div class="modal-panel">
        <div class="modal-head">
            <h3>Send message</h3>
            <button class="modal-close" id="messageModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="messageModalBody"></div>
    </div>
</div>

<div class="modal-overlay" id="badgeModal">
    <div class="modal-panel modal-panel-sm">
        <div class="modal-head">
            <h3 id="badgeModalTitle">Manage bus badge</h3>
            <button class="modal-close" id="badgeModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="badgeModalBody"></div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/auth.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/calendar.js"></script>
<script src="js/timetable.js"></script>
<script src="js/homework.js"></script>
<script src="js/messages.js"></script>
<script src="js/badges.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
